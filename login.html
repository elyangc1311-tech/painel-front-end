<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elesys - Login</title>
    <!-- Ícones via Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vínculo com o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contentor-fluxo">
        <nav class="passos">
            <div class="passo ativo">
                <div class="caixa-icone preenchida">
                    <i class="fas fa-key"></i>
                </div>
                <span class="texto-passo">Login</span>
            </div>
            <div class="passo">
                <div class="caixa-icone contornada">
                    <i class="fas fa-envelope"></i>
                </div>
                <span class="texto-passo">Recuperação</span>
            </div>
            <div class="passo">
                <div class="caixa-icone contornada">
                    <i class="fas fa-check"></i>
                </div>
                <span class="texto-passo">E-mail enviado</span>
            </div>
        </nav>
    </div>
    <div class="identificador-tela">
        <span>TELA 01</span> / <span>LOGIN</span>
    </div>

    <main class="cartao-login">
          <div class="marca">
            <div class="icone-logo">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <h1 class="nome-logo">elesys</h1>
        </div>

        <div class="cabecalho-form">
            <p class="etapa-info">ETAPA 1 DE 2 &bull; AUTENTICAÇÃO SEGURA</p>
            <h2 class="titulo-boas-vindas">Boas-vindas de volta</h2>
            <p class="subtitulo-instrucao">Acesse o painel para acompanhar sua operação TESTANDO PARA VOCE VER OS RESULTADOS.</p>
        </div>

        <form class="formulario-login">
            <div class="grupo-campo">
                <label for="email" class="rotulo-campo">E-mail</label>
                <div class="caixa-entrada">
                    <i class="far fa-envelope icone-campo"></i>
                    <input type="email" id="email" placeholder="nome@empresa.com" required>
                </div>
            </div>

            <div class="grupo-campo">
                <label for="senha" class="rotulo-campo">Senha</label>
                <div class="caixa-entrada">
                    <i class="fas fa-lock icone-campo"></i>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                    <button type="button" class="botao-mostrar-senha" aria-label="Mostrar senha">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="linha-opcoes">
                <label class="opcao-lembrar">
                    <input type="checkbox" checked>
                    <span class="texto-checkbox">Lembrar de mim</span>
                </label>
                <a href="#" class="link-esqueci">Esqueci minha senha</a>
            </div>

            <button type="submit" class="botao-entrar">
                <span>Entrar no painel</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="ambiente-demo">
            <p class="rotulo-demo">AMBIENTE DEMONSTRATIVO</p>
            <div class="credenciais-demo">
                <span class="credencial">admin@elesys.com</span>
                <span class="separador">&bull;</span>
                <span class="credencial">Elesys123</span>
            </div>
        </div>
    </main>
</body>
</html>
